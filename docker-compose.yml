services:
  postgres:
    image: postgres:16-alpine
    container_name: askim-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: askim
      POSTGRES_PASSWORD: askim
      POSTGRES_DB: askim_erp
      TZ: Asia/Seoul
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./pgdata:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U askim -d askim_erp"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: askim-pgadmin
    restart: unless-stopped
    profiles: ["gui"]
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@askim.local
      PGADMIN_DEFAULT_PASSWORD: askim
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "127.0.0.1:5050:80"
    depends_on:
      postgres:
        condition: service_healthy
